<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Aurora Signal — WebRTC 信令服务演示" />
  <meta name="theme-color" content="#0b1020" />
  <title>WebRTC Signaling · Demo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌌</text></svg>" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0b1020;color:#e6edf3;line-height:1.5;min-height:100vh}
    .hidden{display:none!important}
    .container{max-width:960px;margin:0 auto;padding:20px 16px}
    .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    .header h1{font-size:1.35rem;font-weight:700;background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .badge{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:3px 10px;border-radius:999px;background:#1e293b;color:#94a3b8}
    .badge--online{background:#064e3b;color:#34d399}
    .badge--warn{background:#422006;color:#fbbf24}
    .panel{background:#111827;border:1px solid #1e293b;border-radius:12px;padding:24px;max-width:400px;margin:0 auto}
    .form-row{margin-bottom:14px}
    .form-row label{display:block;font-size:.8rem;font-weight:500;color:#94a3b8;margin-bottom:4px}
    .form-row input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #2d3848;background:#0f1730;color:#e6edf3;font-size:.9rem}
    .form-row input:focus{outline:none;border-color:#3b82f6}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 20px;border-radius:8px;border:none;font-size:.9rem;font-weight:500;cursor:pointer;color:#e6edf3;background:#1e293b}
    .btn:hover{background:#334155}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .btn-primary{width:100%;margin-top:4px;background:linear-gradient(135deg,#2563eb,#7c3aed)}
    .btn-primary:hover{background:linear-gradient(135deg,#1d4ed8,#6d28d9)}
    .btn-sm{padding:8px 14px;font-size:.8rem}
    .media-controls{display:flex;justify-content:center;gap:12px;padding:14px 0}
    .btn-icon{width:48px;height:48px;border-radius:50%;border:none;background:#1e293b;color:#e6edf3;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:20px}
    .btn-icon:hover{background:#334155}
    .btn-icon--danger{background:#991b1b}
    .btn-icon--danger:hover{background:#b91c1c}
    .btn-icon--muted{background:#92400e;color:#fbbf24}
    .video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
    .video-card{position:relative;border-radius:10px;overflow:hidden;background:#000;border:1px solid #1e293b;aspect-ratio:16/9}
    .video-card video{width:100%;height:100%;object-fit:cover;display:block}
    .video-card--local{border-color:#3b82f6}
    .video-label{position:absolute;bottom:6px;left:8px;font-size:.72rem;font-weight:500;background:rgba(0,0,0,.6);color:#e6edf3;padding:2px 8px;border-radius:4px}
    .participants{margin-top:12px;background:#111827;border:1px solid #1e293b;border-radius:10px;padding:12px 14px}
    .participants summary{cursor:pointer;font-size:.85rem;font-weight:600;color:#94a3b8;user-select:none}
    .participants ul{list-style:none;margin-top:8px}
    .participants li{padding:5px 0;font-size:.82rem;color:#cbd5e1;display:flex;align-items:center;gap:6px}
    .participants li::before{content:"";width:6px;height:6px;border-radius:50%;background:#22c55e;flex-shrink:0}
    .chat{margin-top:12px;background:#111827;border:1px solid #1e293b;border-radius:10px;overflow:hidden}
    .chat-log{padding:10px 14px;min-height:100px;max-height:200px;overflow-y:auto;font-size:.8rem;line-height:1.6;color:#cbd5e1}
    .chat-log .msg-time{color:#475569;margin-right:6px}
    .chat-log .msg-name{font-weight:600;color:#60a5fa}
    .chat-log .msg-sys{color:#94a3b8;font-style:italic}
    .chat-input{display:flex;border-top:1px solid #1e293b}
    .chat-input input{flex:1;padding:10px 14px;border:none;background:transparent;color:#e6edf3;font-size:.85rem}
    .chat-input input:focus{outline:none}
    .chat-input .btn{border-radius:0}
    .status{margin-top:16px;padding:8px 14px;border-radius:8px;font-size:.8rem;border-left:4px solid #2d3848;background:#111827}
    .status-info{border-left-color:#3b82f6}
    .status-ok{border-left-color:#22c55e;background:#0f2a1a}
    .status-warn{border-left-color:#eab308;background:#2a2510}
    .status-error{border-left-color:#ef4444;background:#2a1010}
    @media (max-width:600px){
      .container{padding:12px 10px}
      .video-grid{grid-template-columns:1fr}
      .panel{padding:18px 16px}
      .btn-icon{width:42px;height:42px;font-size:18px}
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>WebRTC Signaling</h1>
      <span class="badge" id="connBadge">离线</span>
    </header>

    <section class="panel" id="joinPanel">
      <div class="form-row">
        <label for="room">房间</label>
        <input id="room" placeholder="room-001" autocomplete="off" spellcheck="false" />
      </div>
      <div class="form-row">
        <label for="name">昵称</label>
        <input id="name" placeholder="Alice" autocomplete="off" spellcheck="false" />
      </div>
      <button id="start" class="btn btn-primary">加入房间</button>
    </section>

    <section class="panel hidden" id="callPanel" style="max-width:none">
      <div class="video-grid" id="videoGrid">
        <div class="video-card video-card--local">
          <video id="local" autoplay playsinline muted></video>
          <span class="video-label" id="localLabel">我</span>
        </div>
      </div>

      <div class="media-controls">
        <button id="toggleMic" class="btn-icon" title="切换麦克风" aria-label="切换麦克风">🎤</button>
        <button id="toggleCam" class="btn-icon" title="切换摄像头" aria-label="切换摄像头">📷</button>
        <button id="leave" class="btn-icon btn-icon--danger" title="离开房间" aria-label="离开房间">📞</button>
      </div>

      <details class="participants" open>
        <summary>参与者 (<span id="peerCount">0</span>)</summary>
        <ul id="peerList"></ul>
      </details>

      <div class="chat">
        <div class="chat-log" id="chatLog"></div>
        <form class="chat-input" id="chatForm">
          <input id="chatText" placeholder="输入消息..." autocomplete="off" />
          <button type="submit" class="btn btn-sm">发送</button>
        </form>
      </div>
    </section>

    <div class="status" id="status">就绪</div>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    let ws = null, selfId = null, roomId = null, displayName = null, localStream = null;
    let intentionalLeave = false, reconnectAttempts = 0, micEnabled = true, camEnabled = true;
    const MAX_RECONNECT = 5;
    const pcs = new Map();
    const peerNames = new Map();
    let iceServers = [{ urls: ["stun:stun.l.google.com:19302"] }];

    const els = {
      joinPanel: $("#joinPanel"), callPanel: $("#callPanel"), connBadge: $("#connBadge"),
      status: $("#status"), chatLog: $("#chatLog"), chatForm: $("#chatForm"), chatText: $("#chatText"),
      videoGrid: $("#videoGrid"), localVideo: $("#local"), localLabel: $("#localLabel"),
      peerCount: $("#peerCount"), peerList: $("#peerList"), startBtn: $("#start"),
      leaveBtn: $("#leave"), toggleMic: $("#toggleMic"), toggleCam: $("#toggleCam"),
    };

    async function fetchJSON(url, opts = {}) {
      const res = await fetch(url, { headers: { "Content-Type": "application/json" }, ...opts });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }
    const shortId = (id) => id ? id.slice(0, 8) : "???";
    function send(obj) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ version: "v1", ...obj }));
    }

    function setStatus(text, type = "info") {
      els.status.textContent = text;
      els.status.className = `status status-${type}`;
    }
    function setBadge(state) {
      const b = els.connBadge;
      b.className = "badge";
      if (state === "online") { b.textContent = "在线"; b.classList.add("badge--online"); }
      else if (state === "warn") { b.textContent = "重连中"; b.classList.add("badge--warn"); }
      else { b.textContent = "离线"; }
    }
    function logChat(html) {
      const div = document.createElement("div");
      div.innerHTML = `<span class="msg-time">${new Date().toLocaleTimeString()}</span>${html}`;
      els.chatLog.appendChild(div);
      els.chatLog.scrollTop = els.chatLog.scrollHeight;
    }
    const logSystem = (t) => logChat(`<span class="msg-sys">${t}</span>`);
    const logMessage = (name, text) => logChat(`<span class="msg-name">${name}:</span> ${text.replace(/</g, "&lt;")}`);

    function refreshPeerList() {
      els.peerCount.textContent = peerNames.size + 1;
      els.peerList.innerHTML = "";
      const selfLi = document.createElement("li");
      selfLi.textContent = `${displayName} (我)`;
      els.peerList.appendChild(selfLi);
      for (const [, name] of peerNames) {
        const li = document.createElement("li");
        li.textContent = name;
        els.peerList.appendChild(li);
      }
    }

    function ensureVideoCard(peerId) {
      const cid = `vc-${peerId}`;
      let card = document.getElementById(cid);
      if (card) return card.querySelector("video");
      card = document.createElement("div");
      card.id = cid;
      card.className = "video-card";
      const video = document.createElement("video");
      video.autoplay = true;
      video.playsInline = true;
      const label = document.createElement("span");
      label.className = "video-label";
      label.textContent = peerNames.get(peerId) || shortId(peerId);
      card.appendChild(video);
      card.appendChild(label);
      els.videoGrid.appendChild(card);
      return video;
    }
    const removeVideoCard = (pid) => { const c = document.getElementById(`vc-${pid}`); if (c) c.remove(); };

    function createPC(peerId) {
      const pc = new RTCPeerConnection({ iceServers });
      pcs.set(peerId, pc);
      if (localStream) localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
      pc.ontrack = (ev) => { ensureVideoCard(peerId).srcObject = ev.streams[0]; };
      pc.onicecandidate = (ev) => {
        if (ev.candidate) send({ type: "trickle", to: peerId, payload: { candidate: ev.candidate } });
      };
      pc.onconnectionstatechange = () => {
        if (pc.connectionState === "failed") logSystem(`与 ${peerNames.get(peerId) || shortId(peerId)} 的连接失败`);
      };
      return pc;
    }
    async function negotiate(peerId) {
      const pc = pcs.get(peerId);
      if (!pc) return;
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      send({ type: "offer", to: peerId, payload: { sdp: offer.sdp } });
    }
    function cleanupPeers() {
      for (const [, pc] of pcs) { try { pc.close(); } catch { /* ignore */ } }
      pcs.clear();
      peerNames.clear();
      els.videoGrid.querySelectorAll(".video-card:not(.video-card--local)").forEach((c) => c.remove());
    }

    async function ensureRoom(rid) {
      try { await fetchJSON(`/api/v1/rooms/${encodeURIComponent(rid)}`); }
      catch {
        await fetchJSON("/api/v1/rooms", { method: "POST", body: JSON.stringify({ id: rid }) });
      }
    }
    async function getToken(rid) {
      const userId = `u-${Math.random().toString(36).slice(2, 10)}`;
      const body = { userId, displayName, role: "speaker", ttlSeconds: 900 };
      const j = await fetchJSON(`/api/v1/rooms/${encodeURIComponent(rid)}/join-token`, { method: "POST", body: JSON.stringify(body) });
      return j.token;
    }

    async function connectWS() {
      const token = await getToken(roomId);
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws/v1?token=${encodeURIComponent(token)}`);

      ws.onopen = () => {
        reconnectAttempts = 0;
        setStatus("已连接，加入房间...", "info");
        send({ type: "join", payload: { roomId, displayName } });
      };

      ws.onmessage = async (e) => {
        const m = JSON.parse(e.data);
        const payload = m.payload || {};
        switch (m.type) {
          case "joined": {
            selfId = payload.self.id;
            if (payload.iceServers && payload.iceServers.length) iceServers = payload.iceServers;
            setBadge("online");
            setStatus(`已加入 ${roomId}`, "ok");
            for (const p of payload.peers || []) {
              peerNames.set(p.id, p.displayName || shortId(p.id));
              createPC(p.id);
              await negotiate(p.id);
            }
            refreshPeerList();
            break;
          }
          case "participant-joined": {
            const pid = payload.id;
            const name = payload.displayName || shortId(pid);
            peerNames.set(pid, name);
            createPC(pid);
            await negotiate(pid);
            refreshPeerList();
            logSystem(`${name} 加入了房间`);
            break;
          }
          case "offer": {
            const pid = m.from;
            const pc = pcs.get(pid) || createPC(pid);
            await pc.setRemoteDescription({ type: "offer", sdp: payload.sdp });
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            send({ type: "answer", to: pid, payload: { sdp: answer.sdp } });
            break;
          }
          case "answer": {
            const pc = pcs.get(m.from);
            if (pc) await pc.setRemoteDescription({ type: "answer", sdp: payload.sdp });
            break;
          }
          case "trickle": {
            const pc = pcs.get(m.from);
            if (pc) { try { await pc.addIceCandidate(payload.candidate); } catch (err) { console.warn("ICE candidate error", err); } }
            break;
          }
          case "participant-left": {
            const pid = payload.id;
            const name = peerNames.get(pid) || shortId(pid);
            const pc = pcs.get(pid);
            if (pc) { pc.close(); pcs.delete(pid); }
            peerNames.delete(pid);
            removeVideoCard(pid);
            refreshPeerList();
            logSystem(`${name} 离开了房间`);
            break;
          }
          case "chat": {
            const senderName = peerNames.get(m.from) || shortId(m.from);
            logMessage(senderName, payload.text || "");
            break;
          }
          case "error": {
            logSystem(`错误 [${payload.code}]: ${payload.message}`);
            setStatus(`错误: ${payload.message}`, "error");
            break;
          }
          default:
            console.log("unhandled message type", m.type, m);
        }
      };

      ws.onerror = () => setStatus("连接出错", "error");
      ws.onclose = () => {
        setBadge("offline");
        if (!intentionalLeave) {
          cleanupPeers();
          refreshPeerList();
          scheduleReconnect();
        } else {
          setStatus("已断开", "info");
        }
      };
    }

    async function scheduleReconnect() {
      if (intentionalLeave || reconnectAttempts >= MAX_RECONNECT) {
        if (reconnectAttempts >= MAX_RECONNECT) setStatus("重连次数已用尽，请手动重新加入", "error");
        return;
      }
      reconnectAttempts++;
      const delay = Math.min(1000 * 2 ** (reconnectAttempts - 1), 16000);
      setBadge("warn");
      setStatus(`连接断开，${(delay / 1000).toFixed(0)}s 后重连 (${reconnectAttempts}/${MAX_RECONNECT})...`, "warn");
      logSystem(`断线重连中... 第${reconnectAttempts}次`);
      await new Promise((r) => setTimeout(r, delay));
      if (intentionalLeave) return;
      try { await connectWS(); }
      catch (e) { logSystem(`重连失败: ${e.message}`); scheduleReconnect(); }
    }

    function toggleMic() {
      if (!localStream) return;
      micEnabled = !micEnabled;
      localStream.getAudioTracks().forEach((t) => (t.enabled = micEnabled));
      els.toggleMic.textContent = micEnabled ? "🎤" : "🔇";
      els.toggleMic.classList.toggle("btn-icon--muted", !micEnabled);
      send({ type: micEnabled ? "unmute" : "mute", payload: { kind: "audio" } });
    }
    function toggleCam() {
      if (!localStream) return;
      camEnabled = !camEnabled;
      localStream.getVideoTracks().forEach((t) => (t.enabled = camEnabled));
      els.toggleCam.textContent = camEnabled ? "📷" : "🚫";
      els.toggleCam.classList.toggle("btn-icon--muted", !camEnabled);
      send({ type: camEnabled ? "unmute" : "mute", payload: { kind: "video" } });
    }

    async function start() {
      roomId = $("#room").value.trim() || "room-001";
      displayName = $("#name").value.trim() || "Guest";
      intentionalLeave = false;
      reconnectAttempts = 0;
      micEnabled = true;
      camEnabled = true;
      els.toggleMic.textContent = "🎤";
      els.toggleCam.textContent = "📷";
      els.toggleMic.classList.remove("btn-icon--muted");
      els.toggleCam.classList.remove("btn-icon--muted");
      els.startBtn.disabled = true;
      setStatus("获取媒体...", "info");
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
        els.localVideo.srcObject = localStream;
      } catch {
        logSystem("摄像头/麦克风获取失败，将以纯信令模式运行");
      }
      els.localLabel.textContent = displayName;
      setStatus("确认房间...", "info");
      await ensureRoom(roomId);
      setStatus("申请令牌...", "info");
      await connectWS();
      els.joinPanel.classList.add("hidden");
      els.callPanel.classList.remove("hidden");
    }

    function leave() {
      intentionalLeave = true;
      if (ws && ws.readyState === WebSocket.OPEN) { send({ type: "leave" }); ws.close(); }
      cleanupPeers();
      if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
      els.localVideo.srcObject = null;
      els.chatLog.innerHTML = "";
      setBadge("offline");
      els.callPanel.classList.add("hidden");
      els.joinPanel.classList.remove("hidden");
      els.startBtn.disabled = false;
      setStatus("已离开房间", "info");
      refreshPeerList();
    }

    function sendChat() {
      const text = els.chatText.value.trim();
      if (!text || !ws) return;
      send({ type: "chat", payload: { text } });
      logMessage("我", text);
      els.chatText.value = "";
    }

    els.startBtn.addEventListener("click", () =>
      start().catch((e) => { setStatus(e.message, "error"); els.startBtn.disabled = false; })
    );
    els.leaveBtn.addEventListener("click", leave);
    els.toggleMic.addEventListener("click", toggleMic);
    els.toggleCam.addEventListener("click", toggleCam);
    els.chatForm.addEventListener("submit", (e) => { e.preventDefault(); sendChat(); });
  </script>
</body>
</html>

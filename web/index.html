<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="WebRTC Signaling — WebRTC 信令服务演示" />
  <meta name="theme-color" content="#f4f6fb" />
  <title>WebRTC Signaling · Demo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>" />
  <style>
    /* ============ 设计变量 ============ */
    :root {
      /* 字体：中文 Resource Han Rounded CN，英文/数字 Code New Roman */
      --font-en: "Code New Roman", "Segoe UI", Roboto, sans-serif;
      --font-cn: "Resource Han Rounded CN", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;

      /* 浅色画布 */
      --bg: #f4f6fb;
      --bg-grad-1: #eef2ff;
      --bg-grad-2: #f5f3ff;
      --card: #ffffff;
      --card-soft: #f8fafc;
      --ink: #0f172a;
      --ink-2: #475569;
      --ink-3: #94a3b8;
      --line: #e6eaf2;
      --line-2: #cbd5e1;
      --brand: #4f46e5;
      --brand-2: #7c3aed;
      --brand-grad: linear-gradient(135deg, #4f46e5, #7c3aed);
      --brand-soft: #eef2ff;
      --ok: #10b981;
      --ok-soft: #ecfdf5;
      --ok-line: #a7f3d0;
      --warn: #f59e0b;
      --warn-soft: #fffbeb;
      --err: #ef4444;
      --err-soft: #fef2f2;
      --shadow-sm: 0 1px 2px rgba(15,23,42,.06);
      --shadow-md: 0 8px 30px -12px rgba(79,70,229,.15);
      --shadow-lg: 0 20px 50px -20px rgba(79,70,229,.25);
      --r-lg: 22px;
      --r-md: 16px;
      --r-sm: 10px;
    }

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    body{
      font-family:var(--font-cn), var(--font-en);
      color:var(--ink);line-height:1.55;min-height:100vh;
      background:
        radial-gradient(900px 420px at 88% -8%, #e0e7ff 0%, rgba(224,231,255,0) 60%),
        radial-gradient(800px 420px at -6% 108%, #ede9fe 0%, rgba(237,233,254,0) 55%),
        var(--bg);
      background-attachment:fixed;
    }
    .hidden{display:none!important}

    /* ============ 布局 ============ */
    .container{max-width:1000px;margin:0 auto;padding:28px 20px 48px}

    /* ============ 顶栏 ============ */
    .header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
    .brand{display:flex;align-items:center;gap:13px;min-width:0}
    .brand-mark{
      width:46px;height:46px;flex:none;border-radius:15px;background:var(--brand-grad);
      color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;
      box-shadow:0 10px 24px -10px rgba(79,70,229,.6);
    }
    .brand-text{min-width:0}
    .brand-text h1{font-size:1.4rem;font-weight:700;letter-spacing:.01em;line-height:1.25;white-space:nowrap}
    .brand-text .sub{font-size:.74rem;color:var(--ink-3);font-weight:500;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
    .badge{
      flex:none;font-size:.74rem;font-weight:600;letter-spacing:.05em;padding:6px 14px;
      border-radius:999px;display:inline-flex;align-items:center;gap:7px;
      background:#f1f5f9;color:var(--ink-3);border:1px solid var(--line);
    }
    .badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
    .badge--online{background:var(--ok-soft);color:#047857;border-color:var(--ok-line)}
    .badge--warn{background:var(--warn-soft);color:#b45309;border-color:#fde68a}

    /* ============ 卡片（加入面板 / 通话面板） ============ */
    .panel{
      background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
      box-shadow:var(--shadow-md);
    }
    #joinPanel{max-width:460px;margin:26px auto 0;padding:32px 34px 30px;text-align:center;position:relative;overflow:hidden}
    #joinPanel::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--brand-grad)}
    .panel-title{font-size:1.18rem;font-weight:700;margin-bottom:6px}
    .panel-desc{font-size:.84rem;color:var(--ink-3);margin-bottom:24px}
    .form-row{text-align:left;margin-bottom:16px}
    .form-row label{display:block;font-size:.8rem;font-weight:600;color:var(--ink-2);margin-bottom:7px}
    .form-row input{
      width:100%;padding:11px 14px;border-radius:var(--r-sm);border:1.5px solid var(--line-2);
      background:var(--card-soft);color:var(--ink);font-family:var(--font-cn),var(--font-en);font-size:.94rem;
      transition:border-color .2s, box-shadow .2s, background .2s;
    }
    .form-row input::placeholder{color:#b7c3d6}
    .form-row input:focus{outline:none;background:#fff;border-color:var(--brand);box-shadow:0 0 0 4px rgba(79,70,229,.14)}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 22px;
      border-radius:var(--r-sm);border:none;font-family:var(--font-cn),var(--font-en);
      font-size:.9rem;font-weight:600;cursor:pointer;color:var(--ink-2);background:#f1f5f9;
      transition:all .18s ease;
    }
    .btn:hover{background:#e8edf5;color:var(--ink)}
    .btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
    .btn-primary{
      width:100%;margin-top:4px;color:#fff;background:var(--brand-grad);
      box-shadow:0 14px 28px -12px rgba(79,70,229,.65);
    }
    .btn-primary:hover{background:linear-gradient(135deg,#4338ca,#6d28d9);filter:none;color:#fff}
    .btn-primary:disabled{background:#a5b4fc}
    .btn-sm{padding:8px 18px;font-size:.82rem;border-radius:9px;width:auto}

    /* ============ 通话面板 ============ */
    #callPanel{padding:24px}
    .video-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
    .video-card{
      position:relative;border-radius:var(--r-md);overflow:hidden;
      background:linear-gradient(135deg,#eef2ff,#faf5ff);aspect-ratio:16/9;
      border:1px solid var(--line);box-shadow:var(--shadow-sm);
    }
    .video-card video{width:100%;height:100%;object-fit:cover;display:block;background:#0f172a}
    .video-card--local{box-shadow:0 0 0 2px var(--brand), var(--shadow-md)}
    .video-label{
      position:absolute;bottom:10px;left:10px;font-size:.72rem;font-weight:700;color:#fff;
      background:rgba(15,23,42,.55);padding:3px 12px;border-radius:999px;
      display:inline-flex;align-items:center;gap:6px;letter-spacing:.03em;
    }
    .video-label::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
    .video-placeholder{
      position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:6px;color:var(--ink-3);font-size:.78rem;
    }
    .video-placeholder .ph-ico{font-size:28px;opacity:.85;line-height:1}

    /* ============ 媒体控制条 ============ */
    .media-controls{display:flex;justify-content:center;gap:16px;padding:18px 0 4px}
    .btn-icon{
      width:52px;height:52px;border-radius:50%;border:1px solid var(--line);cursor:pointer;
      display:flex;align-items:center;justify-content:center;font-size:20px;background:#fff;color:var(--ink-2);
      box-shadow:var(--shadow-sm);transition:all .18s ease;
    }
    .btn-icon:hover{transform:translateY(-2px);box-shadow:0 10px 22px -10px rgba(15,23,42,.3)}
    .btn-icon:active{transform:translateY(0)}
    .btn-icon--danger{background:linear-gradient(135deg,#f87171,#dc2626);color:#fff;border:none;box-shadow:0 12px 24px -10px rgba(220,38,38,.55)}
    .btn-icon--muted{background:linear-gradient(135deg,#fbbf24,#d97706);color:#fff;border:none;box-shadow:0 12px 24px -10px rgba(217,119,6,.45)}

    /* ============ 参与者 ============ */
    .participants{
      margin-top:16px;background:var(--card-soft);border:1px solid var(--line);
      border-radius:var(--r-md);padding:13px 16px;
    }
    .participants summary{
      cursor:pointer;font-size:.86rem;font-weight:700;color:var(--ink-2);
      user-select:none;display:flex;align-items:center;gap:8px;list-style:none;
    }
    .participants summary::-webkit-details-marker{display:none}
    .participants summary::before{
      content:"";display:inline-block;width:0;height:0;
      border-left:5px solid var(--ink-3);border-top:4px solid transparent;border-bottom:4px solid transparent;
      transition:transform .18s ease;
    }
    .participants[open] summary::before{transform:rotate(90deg)}
    .count-pill{font-size:.68rem;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:2px 10px}
    .participants ul{list-style:none;margin-top:8px}
    .participants li{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:.86rem;color:var(--ink-2)}
    .participants li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(16,185,129,.18);flex:none}
    .me-tag{font-size:.64rem;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:1px 8px;border-radius:999px;letter-spacing:.05em}
    .role-tag{margin-left:auto;font-size:.64rem;font-weight:600;color:var(--ink-3);background:#fff;border:1px solid var(--line);padding:1px 8px;border-radius:999px;letter-spacing:.04em}

    /* ============ 聊天 ============ */
    .chat{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
    .chat-head{
      display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);
      background:var(--card-soft);font-size:.86rem;font-weight:700;color:var(--ink-2);
    }
    .chat-log{padding:14px 16px;min-height:108px;max-height:220px;overflow-y:auto;font-size:.88rem;line-height:1.75}
    .chat-log .msg{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
    .chat-log .msg-time{color:#b7c3d6;font-size:.7rem;flex:none}
    .chat-log .msg-name{font-weight:700;color:var(--brand);flex:none}
    .chat-log .msg-text{color:var(--ink-2);word-break:break-word}
    .chat-log .msg-sys{color:var(--ink-3);font-size:.8rem;font-style:italic;display:flex;align-items:baseline;gap:6px}
    .chat-log .sys-dot{color:var(--ok);font-style:normal}
    .chat-input{display:flex;align-items:center;gap:10px;padding:12px;border-top:1px solid var(--line);background:var(--card-soft)}
    .chat-input input{
      flex:1;min-width:0;padding:9px 13px;border:1.5px solid var(--line-2);border-radius:10px;
      background:#fff;color:var(--ink);font-family:var(--font-cn),var(--font-en);font-size:.88rem;
      transition:border-color .2s, box-shadow .2s;
    }
    .chat-input input::placeholder{color:#b7c3d6}
    .chat-input input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
    .chat-input .btn{border-radius:10px;margin:0;width:auto}

    /* ============ 状态条 ============ */
    .status{
      margin-top:18px;padding:11px 16px;border-radius:var(--r-sm);font-size:.84rem;font-weight:500;
      border-left:4px solid var(--line-2);background:var(--card);box-shadow:var(--shadow-sm);
      display:flex;align-items:center;gap:9px;
    }
    .status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line-2);flex:none}
    .status-info{border-left-color:var(--brand);background:var(--brand-soft)}
    .status-info::before{background:var(--brand)}
    .status-ok{border-left-color:var(--ok);background:var(--ok-soft);color:#065f46}
    .status-ok::before{background:var(--ok)}
    .status-warn{border-left-color:var(--warn);background:var(--warn-soft);color:#92400e}
    .status-warn::before{background:var(--warn)}
    .status-error{border-left-color:var(--err);background:var(--err-soft);color:#991b1b}
    .status-error::before{background:var(--err)}

    /* ============ 响应式 ============ */
    @media (max-width:640px){
      .container{padding:18px 12px 32px}
      .brand-text h1{font-size:1.1rem}
      .brand-mark{width:38px;height:38px;font-size:18px}
      #callPanel{padding:14px}
      .video-grid{grid-template-columns:1fr}
      #joinPanel{padding:24px 20px}
      .btn-icon{width:46px;height:46px;font-size:18px}
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <div class="brand-mark">📡</div>
        <div class="brand-text">
          <h1>WebRTC Signaling</h1>
          <div class="sub">Room Demo</div>
        </div>
      </div>
      <span class="badge" id="connBadge">离线</span>
    </header>

    <!-- 加入面板 -->
    <section class="panel" id="joinPanel">
      <div class="panel-title">加入通话房间</div>
      <div class="panel-desc">填写房间号与昵称，体验信令驱动的实时音视频</div>
      <div class="form-row">
        <label for="room">房间</label>
        <input id="room" placeholder="room-001" autocomplete="off" spellcheck="false" />
      </div>
      <div class="form-row">
        <label for="name">昵称</label>
        <input id="name" placeholder="Alice" autocomplete="off" spellcheck="false" />
      </div>
      <button id="start" class="btn btn-primary">加入房间</button>
    </section>

    <!-- 通话面板 -->
    <section class="panel hidden" id="callPanel">
      <div class="video-grid" id="videoGrid">
        <div class="video-card video-card--local">
          <video id="local" autoplay playsinline muted></video>
          <span class="video-label" id="localLabel">我</span>
        </div>
      </div>

      <div class="media-controls">
        <button id="toggleMic" class="btn-icon" title="切换麦克风" aria-label="切换麦克风">🎤</button>
        <button id="toggleCam" class="btn-icon" title="切换摄像头" aria-label="切换摄像头">📷</button>
        <button id="leave" class="btn-icon btn-icon--danger" title="离开房间" aria-label="离开房间">📞</button>
      </div>

      <details class="participants" open>
        <summary>参与者 <span class="count-pill" id="peerCount">0</span></summary>
        <ul id="peerList"></ul>
      </details>

      <div class="chat">
        <div class="chat-head">💬 房间聊天</div>
        <div class="chat-log" id="chatLog"></div>
        <form class="chat-input" id="chatForm">
          <input id="chatText" placeholder="输入消息..." autocomplete="off" />
          <button type="submit" class="btn btn-primary btn-sm">发送</button>
        </form>
      </div>
    </section>

    <div class="status" id="status">就绪</div>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    let ws = null, selfId = null, roomId = null, displayName = null, localStream = null;
    let intentionalLeave = false, reconnectAttempts = 0, micEnabled = true, camEnabled = true;
    const MAX_RECONNECT = 5;
    const pcs = new Map();
    const peerNames = new Map();
    let iceServers = [{ urls: ["stun:stun.l.google.com:19302"] }];

    const els = {
      joinPanel: $("#joinPanel"), callPanel: $("#callPanel"), connBadge: $("#connBadge"),
      status: $("#status"), chatLog: $("#chatLog"), chatForm: $("#chatForm"), chatText: $("#chatText"),
      videoGrid: $("#videoGrid"), localVideo: $("#local"), localLabel: $("#localLabel"),
      peerCount: $("#peerCount"), peerList: $("#peerList"), startBtn: $("#start"),
      leaveBtn: $("#leave"), toggleMic: $("#toggleMic"), toggleCam: $("#toggleCam"),
    };

    async function fetchJSON(url, opts = {}) {
      const res = await fetch(url, { headers: { "Content-Type": "application/json" }, ...opts });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }
    const shortId = (id) => id ? id.slice(0, 8) : "???";
    function send(obj) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ version: "v1", ...obj }));
    }

    function setStatus(text, type = "info") {
      els.status.textContent = text;
      els.status.className = `status status-${type}`;
    }
    function setBadge(state) {
      const b = els.connBadge;
      b.className = "badge";
      if (state === "online") { b.textContent = "在线"; b.classList.add("badge--online"); }
      else if (state === "warn") { b.textContent = "重连中"; b.classList.add("badge--warn"); }
      else { b.textContent = "离线"; }
    }
    function logChat(html) {
      const div = document.createElement("div");
      div.innerHTML = `<span class="msg-time">${new Date().toLocaleTimeString()}</span>${html}`;
      els.chatLog.appendChild(div);
      els.chatLog.scrollTop = els.chatLog.scrollHeight;
    }
    const logSystem = (t) => logChat(`<span class="msg-sys"><span class="sys-dot">●</span> ${t}</span>`);
    const logMessage = (name, text) => logChat(`<span class="msg"><span class="msg-name">${name}:</span><span class="msg-text">${text.replace(/</g, "&lt;")}</span></span>`);

    function refreshPeerList() {
      els.peerCount.textContent = peerNames.size + 1;
      els.peerList.innerHTML = "";
      const selfLi = document.createElement("li");
      selfLi.textContent = `${displayName} `;
      const meTag = document.createElement("span");
      meTag.className = "me-tag";
      meTag.textContent = "我";
      selfLi.appendChild(meTag);
      const selfRole = document.createElement("span");
      selfRole.className = "role-tag";
      selfRole.textContent = "speaker";
      selfLi.appendChild(selfRole);
      els.peerList.appendChild(selfLi);
      for (const [, name] of peerNames) {
        const li = document.createElement("li");
        li.textContent = `${name} `;
        const role = document.createElement("span");
        role.className = "role-tag";
        role.textContent = "speaker";
        li.appendChild(role);
        els.peerList.appendChild(li);
      }
    }

    function ensureVideoCard(peerId) {
      const cid = `vc-${peerId}`;
      let card = document.getElementById(cid);
      if (card) return card.querySelector("video");
      card = document.createElement("div");
      card.id = cid;
      card.className = "video-card";
      const ph = document.createElement("div");
      ph.className = "video-placeholder";
      ph.innerHTML = `<span class="ph-ico">📷</span><span>等待画面…</span>`;
      card.appendChild(ph);
      const video = document.createElement("video");
      video.autoplay = true;
      video.playsInline = true;
      const label = document.createElement("span");
      label.className = "video-label";
      label.textContent = peerNames.get(peerId) || shortId(peerId);
      card.appendChild(video);
      card.appendChild(label);
      els.videoGrid.appendChild(card);
      return video;
    }
    const removeVideoCard = (pid) => { const c = document.getElementById(`vc-${pid}`); if (c) c.remove(); };

    function createPC(peerId) {
      const pc = new RTCPeerConnection({ iceServers });
      pcs.set(peerId, pc);
      if (localStream) localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
      pc.ontrack = (ev) => {
        const v = ensureVideoCard(peerId);
        const ph = document.getElementById(`vc-${peerId}`)?.querySelector(".video-placeholder");
        if (ph) ph.remove();
        v.srcObject = ev.streams[0];
      };
      pc.onicecandidate = (ev) => {
        if (ev.candidate) send({ type: "trickle", to: peerId, payload: { candidate: ev.candidate } });
      };
      pc.onconnectionstatechange = () => {
        if (pc.connectionState === "failed") logSystem(`与 ${peerNames.get(peerId) || shortId(peerId)} 的连接失败`);
      };
      return pc;
    }
    async function negotiate(peerId) {
      const pc = pcs.get(peerId);
      if (!pc) return;
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      send({ type: "offer", to: peerId, payload: { sdp: offer.sdp } });
    }
    function cleanupPeers() {
      for (const [, pc] of pcs) { try { pc.close(); } catch { /* ignore */ } }
      pcs.clear();
      peerNames.clear();
      els.videoGrid.querySelectorAll(".video-card:not(.video-card--local)").forEach((c) => c.remove());
    }

    async function ensureRoom(rid) {
      try { await fetchJSON(`/api/v1/rooms/${encodeURIComponent(rid)}`); }
      catch {
        await fetchJSON("/api/v1/rooms", { method: "POST", body: JSON.stringify({ id: rid }) });
      }
    }
    async function getToken(rid) {
      const userId = `u-${Math.random().toString(36).slice(2, 10)}`;
      const body = { userId, displayName, role: "speaker", ttlSeconds: 900 };
      const j = await fetchJSON(`/api/v1/rooms/${encodeURIComponent(rid)}/join-token`, { method: "POST", body: JSON.stringify(body) });
      return j.token;
    }

    async function connectWS() {
      const token = await getToken(roomId);
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws/v1?token=${encodeURIComponent(token)}`);

      ws.onopen = () => {
        reconnectAttempts = 0;
        setStatus("已连接，加入房间...", "info");
        send({ type: "join", payload: { roomId, displayName } });
      };

      ws.onmessage = async (e) => {
        const m = JSON.parse(e.data);
        const payload = m.payload || {};
        switch (m.type) {
          case "joined": {
            selfId = payload.self.id;
            if (payload.iceServers && payload.iceServers.length) iceServers = payload.iceServers;
            setBadge("online");
            setStatus(`已加入 ${roomId}`, "ok");
            for (const p of payload.peers || []) {
              peerNames.set(p.id, p.displayName || shortId(p.id));
              createPC(p.id);
              await negotiate(p.id);
            }
            refreshPeerList();
            break;
          }
          case "participant-joined": {
            const pid = payload.id;
            const name = payload.displayName || shortId(pid);
            peerNames.set(pid, name);
            createPC(pid);
            await negotiate(pid);
            refreshPeerList();
            logSystem(`${name} 加入了房间`);
            break;
          }
          case "offer": {
            const pid = m.from;
            const pc = pcs.get(pid) || createPC(pid);
            await pc.setRemoteDescription({ type: "offer", sdp: payload.sdp });
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            send({ type: "answer", to: pid, payload: { sdp: answer.sdp } });
            break;
          }
          case "answer": {
            const pc = pcs.get(m.from);
            if (pc) await pc.setRemoteDescription({ type: "answer", sdp: payload.sdp });
            break;
          }
          case "trickle": {
            const pc = pcs.get(m.from);
            if (pc) { try { await pc.addIceCandidate(payload.candidate); } catch (err) { console.warn("ICE candidate error", err); } }
            break;
          }
          case "participant-left": {
            const pid = payload.id;
            const name = peerNames.get(pid) || shortId(pid);
            const pc = pcs.get(pid);
            if (pc) { pc.close(); pcs.delete(pid); }
            peerNames.delete(pid);
            removeVideoCard(pid);
            refreshPeerList();
            logSystem(`${name} 离开了房间`);
            break;
          }
          case "chat": {
            const senderName = peerNames.get(m.from) || shortId(m.from);
            logMessage(senderName, payload.text || "");
            break;
          }
          case "error": {
            logSystem(`错误 [${payload.code}]: ${payload.message}`);
            setStatus(`错误: ${payload.message}`, "error");
            break;
          }
          default:
            console.log("unhandled message type", m.type, m);
        }
      };

      ws.onerror = () => setStatus("连接出错", "error");
      ws.onclose = () => {
        setBadge("offline");
        if (!intentionalLeave) {
          cleanupPeers();
          refreshPeerList();
          scheduleReconnect();
        } else {
          setStatus("已断开", "info");
        }
      };
    }

    async function scheduleReconnect() {
      if (intentionalLeave || reconnectAttempts >= MAX_RECONNECT) {
        if (reconnectAttempts >= MAX_RECONNECT) setStatus("重连次数已用尽，请手动重新加入", "error");
        return;
      }
      reconnectAttempts++;
      const delay = Math.min(1000 * 2 ** (reconnectAttempts - 1), 16000);
      setBadge("warn");
      setStatus(`连接断开，${(delay / 1000).toFixed(0)}s 后重连 (${reconnectAttempts}/${MAX_RECONNECT})...`, "warn");
      logSystem(`断线重连中... 第${reconnectAttempts}次`);
      await new Promise((r) => setTimeout(r, delay));
      if (intentionalLeave) return;
      try { await connectWS(); }
      catch (e) { logSystem(`重连失败: ${e.message}`); scheduleReconnect(); }
    }

    function toggleMic() {
      if (!localStream) return;
      micEnabled = !micEnabled;
      localStream.getAudioTracks().forEach((t) => (t.enabled = micEnabled));
      els.toggleMic.textContent = micEnabled ? "🎤" : "🔇";
      els.toggleMic.classList.toggle("btn-icon--muted", !micEnabled);
      send({ type: micEnabled ? "unmute" : "mute", payload: { kind: "audio" } });
    }
    function toggleCam() {
      if (!localStream) return;
      camEnabled = !camEnabled;
      localStream.getVideoTracks().forEach((t) => (t.enabled = camEnabled));
      els.toggleCam.textContent = camEnabled ? "📷" : "🚫";
      els.toggleCam.classList.toggle("btn-icon--muted", !camEnabled);
      send({ type: camEnabled ? "unmute" : "mute", payload: { kind: "video" } });
    }

    async function start() {
      roomId = $("#room").value.trim() || "room-001";
      displayName = $("#name").value.trim() || "Guest";
      intentionalLeave = false;
      reconnectAttempts = 0;
      micEnabled = true;
      camEnabled = true;
      els.toggleMic.textContent = "🎤";
      els.toggleCam.textContent = "📷";
      els.toggleMic.classList.remove("btn-icon--muted");
      els.toggleCam.classList.remove("btn-icon--muted");
      els.startBtn.disabled = true;
      setStatus("获取媒体...", "info");
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
        els.localVideo.srcObject = localStream;
      } catch {
        logSystem("摄像头/麦克风获取失败，将以纯信令模式运行");
      }
      els.localLabel.textContent = displayName;
      setStatus("确认房间...", "info");
      await ensureRoom(roomId);
      setStatus("申请令牌...", "info");
      await connectWS();
      els.joinPanel.classList.add("hidden");
      els.callPanel.classList.remove("hidden");
    }

    function leave() {
      intentionalLeave = true;
      if (ws && ws.readyState === WebSocket.OPEN) { send({ type: "leave" }); ws.close(); }
      cleanupPeers();
      if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
      els.localVideo.srcObject = null;
      els.chatLog.innerHTML = "";
      setBadge("offline");
      els.callPanel.classList.add("hidden");
      els.joinPanel.classList.remove("hidden");
      els.startBtn.disabled = false;
      setStatus("已离开房间", "info");
      refreshPeerList();
    }

    function sendChat() {
      const text = els.chatText.value.trim();
      if (!text || !ws) return;
      send({ type: "chat", payload: { text } });
      logMessage("我", text);
      els.chatText.value = "";
    }

    els.startBtn.addEventListener("click", () =>
      start().catch((e) => { setStatus(e.message, "error"); els.startBtn.disabled = false; })
    );
    els.leaveBtn.addEventListener("click", leave);
    els.toggleMic.addEventListener("click", toggleMic);
    els.toggleCam.addEventListener("click", toggleCam);
    els.chatForm.addEventListener("submit", (e) => { e.preventDefault(); sendChat(); });
  </script>
</body>
</html>

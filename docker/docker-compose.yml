networks:
  signal-net:
    driver: bridge

services:
  server:
    build:
      context: ..
    image: webrtc-signaling:dev
    restart: unless-stopped
    environment:
      SIGNAL_JWT_SECRET: ${SIGNAL_JWT_SECRET:?set SIGNAL_JWT_SECRET before starting}
      SIGNAL_REDIS_ADDR: redis:6379
      SIGNAL_LOG_LEVEL: ${SIGNAL_LOG_LEVEL:-info}
    ports:
      - "${SIGNAL_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/signal-server", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - signal-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - signal-net
